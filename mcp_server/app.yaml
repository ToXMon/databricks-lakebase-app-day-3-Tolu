command:
  - "python"
  - "weather_mcp_server.py"

resources:
  - name: requirements
    source:
      path: ./requirements.txt

env:
  - name: DATABRICKS_APP_PORT
    value: "8000"
  - name: LOG_LEVEL
    value: "INFO"

# Allow unauthenticated access to MCP endpoints
# This is required for AI Gateway to discover tools
auth:
  default_access: "allow"
