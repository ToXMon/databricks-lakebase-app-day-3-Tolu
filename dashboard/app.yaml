command:
  - "python"
  - "app.py"

resources:
  - name: requirements
    source:
      path: ./requirements.txt
  # Pulls in the sibling mcp_server/ package (openmeteo_adapter.py,
  # weather_codes.py) so `import mcp_server.openmeteo_adapter` resolves when
  # this app is deployed as its own Databricks App, separate from
  # mcp_server/'s own app. Mirrors the reference's `resources:` shape.
  - name: weather-mcp-server
    source:
      path: ../mcp_server

env:
  - name: FLASK_RUN_HOST
    value: "0.0.0.0"
  - name: FLASK_RUN_PORT
    value: "8001"
  - name: LOG_LEVEL
    value: "INFO"
